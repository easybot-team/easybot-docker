name: Build and Push Docker image

on:
  push:
    branches: [main]

jobs:
  # -----------------------------
  # DEV
  # -----------------------------
  dev-build-and-push:
    if: contains(github.event.head_commit.message, 'update(dev)')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Slim (dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/Dockerfile
          target: slim
          push: true
          platforms: linux/amd64
          build-args: |
            BOOT_DIR=dev
          tags: miuxue/easybot:dev-slim

      - name: Build and push Full (dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/Dockerfile
          target: full
          push: true
          platforms: linux/amd64
          build-args: |
            BOOT_DIR=dev
          tags: miuxue/easybot:dev-full

  # -----------------------------
  # STABLE
  # -----------------------------
  stable-build-and-push:
    if: contains(github.event.head_commit.message, 'update(stable)')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Slim (stable)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/Dockerfile
          target: slim
          push: true
          platforms: linux/amd64
          build-args: |
            BOOT_DIR=stable
          tags: miuxue/easybot:slim

      - name: Build and push Full (stable)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/Dockerfile
          target: full
          push: true
          platforms: linux/amd64
          build-args: |
            BOOT_DIR=stable
          tags: miuxue/easybot:full
